    Pagination:
      type: object
      properties:
        pageCount:
          type: integer
          description: Number of pages available
          example: 1
        pageSize:
          type: integer
          description: Page size which specifies how many records per page will be returned (default 50).
            Example - https://api.xero.com/bankfeeds.xro/1.0/Statements?pageSize=100 to specify page size
            of 100
          example: 10
        page:
          type: integer
          description: Page number which specifies the set of records to retrieve. Example - https://api.xero.com/bankfeeds.xro/1.0/Statements?page=2
            to get the second set of the records. When page value is not a number or a negative number,
            by default, the first set of records is returned
          example: 1
        itemCount:
          type: integer
          description: Number of items returned
          example: 2
      description: Pagination details of the returned page of results
    StatementLine:
      type: object
      properties:
        reference:
          maximum: 255
          type: string
          description: Optional field to enhance the Description
          example: Reference for statement line 2
        transactionType:
          maximum: 30
          type: string
          description: Descriptive transaction type
          example: Refund
        payeeName:
          maximum: 255
          type: string
          description: Typically the merchant or payee name
          example: Payee name for statement line 2
        amount:
          type: number
          description: Transaction amount
          format: double
          example: 5.0
          x-is-money: true
        description:
          maximum: 2000
          type: string
          description: Transaction description
          example: Description for statement line 2
        chequeNumber:
          maximum: 20
          type: string
          description: The cheque/check number
          example: '021'
        creditDebitIndicator:
          description: Whether the transaction is a credit or a debit, from the perspective of the customer
          allOf:
          - $ref: '#/components/schemas/CreditDebitIndicator'
        transactionId:
          type: string
          description: Financial institute's internal transaction identifier. If provided this field is
            factored into duplicate detection
          example: transaction-id-2
        postedDate:
          type: string
          description: The date that the transaction was processed or cleared as seen in internet banking
            ISO-8601 YYYY-MM-DD
          format: date
          example: '2018-06-10'
      description: the lines details for a statement
    Statements:
      type: object
      properties:
        pagination:
          description: Pagination details of the returned page of results
          allOf:
          - $ref: '#/components/schemas/Pagination'
        items:
          type: array
          description: List of statements
          items:
            $ref: '#/components/schemas/Statement'
      description: A page of statements, or the statements submitted in a create request
      externalDocs:
        url: https://developer.xero.com/documentation/bank-feeds-api/statements
    StatementLines:
      type: array
      description: The transaction lines of a statement
      items:
        $ref: '#/components/schemas/StatementLine'
