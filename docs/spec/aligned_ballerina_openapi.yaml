  parameters:
    requiredHeader:
      name: Xero-Tenant-Id
      in: header
      description: Xero identifier for Tenant
      required: true
      style: simple
      explode: false
      schema:
        type: string
      x-ballerina-name: xeroTenantId
    idempotencyKey:
      name: Idempotency-Key
      in: header
      description: This allows you to safely retry requests without the risk of duplicate processing.
        128 character max
      required: false
      style: simple
      explode: false
      schema:
        type: string
      example: KEY_VALUE
      x-snake: idempotency_key
      x-ballerina-name: idempotencyKey
  securitySchemes:
    OAuth2:
      type: oauth2
      description: For more information visit https://developer.xero.com/documentation/oauth2/overview
      flows:
        authorizationCode:
          authorizationUrl: https://login.xero.com/identity/connect/authorize
          tokenUrl: https://identity.xero.com/connect/token
          scopes:
            email: Grant read-only access to your email
            openid: Grant read-only access to your open id
            profile: your profile information
            bankfeeds: Grant read-write access to bankfeeds
